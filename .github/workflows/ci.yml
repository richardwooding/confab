name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test -race -timeout 600s ./...
      - run: go vet ./...
      - name: WASM compile check
        run: GOOS=js GOARCH=wasm go build -o /dev/null ./cmd/confab-wasm
      - name: Full web build
        run: make wasm && go build ./cmd/confab

  complexity:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: richardwooding/codemetrics@v0.12.4
        with:
          max-cognitive: "15"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
