# confab runs as exactly ONE always-on machine: the relay holds live call
# sessions in memory, so auto-stop or a second machine would kill or split
# calls in progress. Media is peer-to-peer and never touches this server.
app = "confab-call"
primary_region = "jnb"

[build]
  image = "ghcr.io/richardwooding/confab:latest"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "10s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

# Rolling deploy: replace one machine at a time so at most 1/N sessions churn.
# Session affinity (relay Options.Router) keeps each session pinned to one
# machine; a replaced machine's in-flight calls recover via reconnect=rejoin.
# Going multi-node is an explicit `fly scale count N` (+ min_machines_running N).
[deploy]
  strategy = "rolling"
  max_unavailable = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
